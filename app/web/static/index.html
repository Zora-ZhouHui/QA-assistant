<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roma 智能助手</title>
  <link rel="stylesheet" href="/static/style.css?v=16">
</head>

<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="logo">
        <div class="logo-mark">✦</div>
        <h1>Roma 智能助手</h1>
      </div>

      <button id="newSessionBtn" class="primary new-session-btn">＋ 新建会话</button>

      <section class="panel">
        <h2>会话列表</h2>
        <ul id="sessionList" class="session-list"></ul>
      </section>
    </aside>

    <main class="chat">
      <div id="messages" class="messages">
        <div class="msg bot">
          <div class="avatar">✦</div>
          <div class="msg-body">
            <div class="answer-text">你好！知识文件已在服务启动时自动入库，直接基于你的资料提问即可。</div>
          </div>
        </div>
      </div>
      <div class="input-bar">
        <div id="imagePreview" class="image-preview" hidden></div>
        <div class="input-shell">
          <button id="imageBtn" class="image-btn" title="上传截图（也可直接粘贴或拖拽）">图片</button>
          <input type="file" id="imageInput" accept="image/*" multiple hidden>
          <textarea id="questionInput" rows="1" placeholder="输入问题，Enter 发送，Shift+Enter 换行；支持粘贴/拖拽截图"></textarea>
          <label class="web-toggle" title="允许助手自动联网搜索最新信息">
            <input type="checkbox" id="webSearchCheck" checked>
            <span class="web-toggle-track"></span>
            <span>联网</span>
          </label>
          <button id="sendBtn" class="primary">发送</button>
        </div>
      </div>
    </main>

    <aside class="log-panel" id="logPanel">
      <div class="log-header">
        <h2>执行日志</h2>
        <button id="logToggle" class="log-toggle-btn" title="收起日志面板">收起</button>
      </div>
      <div id="logList" class="log-list">
        <p class="log-empty">发送问题后，这里会实时显示助手的每一步检索与决策过程</p>
      </div>
      <button id="logRail" class="log-rail" title="展开日志面板">执行日志</button>
    </aside>
  </div>
  <!-- 截图场景三选一弹窗：上传图片后弹出，选定场景后即开始多模态解析 -->
  <div id="sceneModal" class="modal-overlay" hidden>
    <div class="modal-card">
      <h3 class="modal-title">选择截图场景</h3>
      <p class="modal-hint">助手将按所选场景用多模态模型解析图片，再结合本地知识库与联网作答</p>
      <div class="scene-options" id="sceneOptions">
        <button type="button" class="scene-card" data-scene="console_error">
          <span class="scene-name">控制台报错截图</span>
          <span class="scene-desc">提取报错信息、错误栈、触发场景</span>
        </button>
        <button type="button" class="scene-card" data-scene="layout_misalign">
          <span class="scene-name">布局错位截图</span>
          <span class="scene-desc">识别页面元素、容器尺寸、flex/grid 与偏移量</span>
        </button>
        <button type="button" class="scene-card" data-scene="design_compare">
          <span class="scene-name">设计稿对比截图</span>
          <span class="scene-desc">标注颜色、尺寸、间距的视觉还原差异</span>
        </button>
      </div>
      <div id="sceneImageHint" class="scene-image-hint" hidden>
        <span id="sceneImageHintText"></span>
        <button type="button" id="sceneAddImageBtn" class="image-add-btn">添加图片</button>
      </div>
      <textarea id="sceneNote" class="modal-note" rows="2" placeholder="补充说明（可选）：如报错的操作步骤、期望的布局效果…"></textarea>
      <div class="modal-actions">
        <button type="button" id="sceneCancel" class="modal-cancel">取消</button>
        <button type="button" id="sceneConfirm" class="primary" disabled>开始解析</button>
      </div>
    </div>
  </div>

  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <script src="/static/app.js?v=20"></script>
</body>

</html>
